<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Background Change</title>
</head>
<body class="flex items-center justify-center h-screen">
    <div class=" w-96 border-solid rounded-md shadow-2xl flex items-center flex-col gap-5">
        <div class="bg-red-500 p-6 w-96 rounded-md">
            <h1 class="text-3xl text-center" id="month">Jan</h1>
        </div>
        <div class="p-6">
            <p class="text-2xl font-sans" id="weekday">Sunday</p>
        </div>
        <div class="p-6">
            <h1 class="text-2xl" id="day">30</h1>
        </div>
        <div class="p-6">
            <h1 class="text-xl" id="year">2023</h1>

        </div>
       
        
    </div>
    <script src="bgchange.js"></script>
</body>
</html>
